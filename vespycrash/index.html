<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/cruciverba/LogoStoriePontederesi_cruciverba.png">
  <link rel="apple-touch-icon" href="/cruciverba/LogoStoriePontederesi_cruciverba.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vespy Crash — Storie Pontederesi</title>
  <meta name="description" content="Vespy Crash: il match-3 di Storie Pontederesi con le emoji di Pontedera. Abbina vespe, ponti, guantoni e altro!">
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script data-goatcounter="https://storiepontederesi.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --rosa:#f2c9be;--rosso:#8b1a2f;--teal:#5bbfad;
      --giallo:#f5c842;--testo:#4a2020;--bg:#fff4f0;
    }
    body{background:var(--rosa);font-family:'Inter',sans-serif;color:var(--testo);
      min-height:100vh;display:flex;flex-direction:column;align-items:center;
      padding:1rem 1rem 2rem;gap:0;user-select:none}

    header{text-align:center;margin-bottom:.6rem}
    h1{font-family:'Permanent Marker',cursive;font-size:clamp(26px,7vw,46px);
      color:var(--rosso);text-transform:uppercase;line-height:1.1}
    .subtitolo{font-size:13px;color:var(--testo);opacity:.75;margin-top:.2rem}

    /* HUD */
    #hud{display:flex;gap:12px;justify-content:center;margin:.6rem 0;flex-wrap:wrap}
    .hud-box{background:var(--bg);border:2px solid var(--rosso);border-radius:12px;
      padding:.4rem .9rem;text-align:center;min-width:80px}
    .hud-label{font-size:10px;font-weight:700;color:var(--rosso);text-transform:uppercase;letter-spacing:.5px}
    .hud-val{font-family:'Permanent Marker',cursive;font-size:22px;color:var(--rosso);line-height:1.2}
    .hud-val.bump{animation:bump .25s ease}
    @keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}

    /* Board */
    #board-wrap{position:relative}
    #board{
      display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
      width:min(352px,96vw);margin:.4rem auto;
    }
    .cell{
      aspect-ratio:1;background:var(--bg);border-radius:8px;
      display:flex;align-items:center;justify-content:center;
      font-size:clamp(20px,5.5vw,32px);cursor:pointer;
      transition:transform .12s,background .12s;
      border:2px solid transparent;
    }
    .cell:hover{transform:scale(1.08)}
    .cell.selected{background:#fce8e2;border-color:var(--rosso);transform:scale(1.12)}
    .cell.matched{animation:pop-out .35s ease forwards}
    @keyframes pop-out{
      0%{transform:scale(1);opacity:1}
      40%{transform:scale(1.4);opacity:.9}
      100%{transform:scale(0);opacity:0}
    }
    .cell.new-in{animation:drop-in .25s ease}
    @keyframes drop-in{
      0%{transform:translateY(-20px);opacity:0}
      100%{transform:translateY(0);opacity:1}
    }

    /* Combo toast */
    #combo-toast{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      font-family:'Permanent Marker',cursive;font-size:32px;color:var(--rosso);
      pointer-events:none;opacity:0;white-space:nowrap;
    }
    #combo-toast.show{animation:combo-anim .7s ease forwards}
    @keyframes combo-anim{
      0%{opacity:0;transform:translate(-50%,-60%) scale(.8)}
      30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}
      70%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-45%) scale(.9)}
    }

    /* Overlay game over */
    #overlay{
      display:none;position:fixed;inset:0;background:rgba(139,26,47,.55);
      align-items:center;justify-content:center;z-index:10;
    }
    #overlay.show{display:flex}
    #gameover-box{
      background:var(--bg);border:3px solid var(--rosso);border-radius:20px;
      padding:2rem 2.2rem;text-align:center;max-width:300px;width:90%;
    }
    #gameover-box h2{font-family:'Permanent Marker',cursive;color:var(--rosso);
      font-size:28px;margin-bottom:.5rem}
    #gameover-box p{font-size:14px;margin-bottom:.3rem;color:var(--testo)}
    .score-final{font-family:'Permanent Marker',cursive;font-size:40px;
      color:var(--rosso);margin:.4rem 0}
    .btn{display:inline-block;margin-top:.8rem;padding:.55rem 1.4rem;
      border-radius:999px;border:2px solid var(--rosso);background:var(--rosso);
      color:var(--bg);font-weight:700;font-size:14px;cursor:pointer;
      text-decoration:none;transition:opacity .15s}
    .btn:hover{opacity:.85}
    .btn-ghost{background:transparent;color:var(--rosso);margin-left:8px}
    .btn-ghost:hover{background:var(--rosso);color:var(--bg)}

    /* Legenda */
    #legenda{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
      max-width:352px;margin:.4rem auto .6rem;font-size:11px;color:var(--testo)}
    .leg-item{display:flex;align-items:center;gap:3px;background:var(--bg);
      border-radius:8px;padding:2px 6px;border:1px solid #ddc8c0}

    /* Nav */
    .nav{font-size:13px;text-align:center;margin-top:.6rem}
    .nav a{color:var(--rosso);font-weight:700;text-decoration:none}
    .nav a:hover{text-decoration:underline}
    .social-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
      font-size:12px;font-weight:700;margin:.8rem 0}
    .social-row a{color:var(--rosso);text-decoration:none}
    .social-row a:hover{text-decoration:underline}
    .logo{width:44px;opacity:.9;margin-top:.3rem}

    /* No-moves notice */
    #no-moves{display:none;font-size:12px;font-weight:700;color:var(--rosso);
      text-align:center;margin-bottom:.3rem}
  </style>
</head>
<body>

<header>
  <h1>Vespy Crash</h1>
  <p class="subtitolo">Il match-3 di Storie Pontederesi · 25 mosse</p>
</header>

<div id="hud">
  <div class="hud-box">
    <div class="hud-label">Punteggio</div>
    <div class="hud-val" id="score-val">0</div>
  </div>
  <div class="hud-box">
    <div class="hud-label">Mosse</div>
    <div class="hud-val" id="moves-val">25</div>
  </div>
  <div class="hud-box">
    <div class="hud-label">Record</div>
    <div class="hud-val" id="best-val">0</div>
  </div>
</div>

<div id="no-moves">Nessuna mossa possibile — griglia rimescolata! 🔀</div>

<div id="board-wrap">
  <div id="board"></div>
  <div id="combo-toast"></div>
</div>

<div id="legenda">
  <div class="leg-item">🛵 Vespa</div>
  <div class="leg-item">🌉 Ponte</div>
  <div class="leg-item">🥊 Guantone</div>
  <div class="leg-item">🌀 Rotonda</div>
  <div class="leg-item">⚙️ Piaggio</div>
  <div class="leg-item">🌻 Toscana</div>
</div>

<div id="overlay">
  <div id="gameover-box">
    <h2>Fine mosse!</h2>
    <p>Punteggio</p>
    <div class="score-final" id="final-score">0</div>
    <p id="record-msg"></p>
    <div>
      <button class="btn" onclick="restart()">↺ Rigioca</button>
      <a class="btn btn-ghost" href="../">← Giochi</a>
    </div>
  </div>
</div>

<div class="nav"><a href="../">← Tutti i giochi</a></div>
<div class="social-row">
  <a href="https://www.instagram.com/storiepontederesi" target="_blank">📸 @storiepontederesi</a>
  <a href="https://storiepontederesi.substack.com" target="_blank">✉ Newsletter</a>
</div>
<img src="../cruciverba/LogoStoriePontederesi_cruciverba.png" alt="Storie Pontederesi" class="logo">

<script>
const EMOJIS = ["🛵","🌉","🥊","🌀","⚙️","🌻"];
const SIZE = 7;
const MAX_MOVES = 25;

let grid = [];
let selected = null;
let score = 0;
let movesLeft = MAX_MOVES;
let animating = false;
let bestScore = parseInt(localStorage.getItem("vespycrash_best") || "0");

// ── Grid init (no initial matches) ───────────────────────────────────────────
function initGrid() {
  grid = [];
  for(let r = 0; r < SIZE; r++) {
    grid[r] = [];
    for(let c = 0; c < SIZE; c++) {
      const forbidden = new Set();
      if(c >= 2 && grid[r][c-1] === grid[r][c-2]) forbidden.add(grid[r][c-1]);
      if(r >= 2 && grid[r-1][c] === grid[r-2][c]) forbidden.add(grid[r-1][c]);
      const avail = EMOJIS.map((_,i) => i).filter(i => !forbidden.has(i));
      grid[r][c] = avail[Math.floor(Math.random() * avail.length)];
    }
  }
}

// ── Match detection ───────────────────────────────────────────────────────────
function findMatches() {
  const matched = new Set();
  for(let r = 0; r < SIZE; r++) {
    for(let c = 0; c < SIZE - 2; c++) {
      if(grid[r][c] !== null && grid[r][c] === grid[r][c+1] && grid[r][c] === grid[r][c+2]) {
        let e = c + 2;
        while(e + 1 < SIZE && grid[r][e+1] === grid[r][c]) e++;
        for(let i = c; i <= e; i++) matched.add(`${r},${i}`);
      }
    }
  }
  for(let c = 0; c < SIZE; c++) {
    for(let r = 0; r < SIZE - 2; r++) {
      if(grid[r][c] !== null && grid[r][c] === grid[r+1][c] && grid[r][c] === grid[r+2][c]) {
        let e = r + 2;
        while(e + 1 < SIZE && grid[e+1][c] === grid[r][c]) e++;
        for(let i = r; i <= e; i++) matched.add(`${i},${c}`);
      }
    }
  }
  return matched;
}

// ── Gravity + refill ──────────────────────────────────────────────────────────
function applyGravity() {
  for(let c = 0; c < SIZE; c++) {
    const tiles = [];
    for(let r = SIZE - 1; r >= 0; r--) {
      if(grid[r][c] !== null) tiles.push(grid[r][c]);
    }
    for(let r = SIZE - 1; r >= 0; r--) {
      const idx = SIZE - 1 - r;
      grid[r][c] = idx < tiles.length
        ? tiles[idx]
        : Math.floor(Math.random() * EMOJIS.length);
    }
  }
}

// ── Valid moves check ─────────────────────────────────────────────────────────
function hasValidMoves() {
  const dirs = [[0,1],[1,0]];
  for(let r = 0; r < SIZE; r++) {
    for(let c = 0; c < SIZE; c++) {
      for(const [dr, dc] of dirs) {
        const nr = r+dr, nc = c+dc;
        if(nr >= SIZE || nc >= SIZE) continue;
        [grid[r][c], grid[nr][nc]] = [grid[nr][nc], grid[r][c]];
        const ok = findMatches().size > 0;
        [grid[r][c], grid[nr][nc]] = [grid[nr][nc], grid[r][c]];
        if(ok) return true;
      }
    }
  }
  return false;
}

function shuffleIfNeeded() {
  if(!hasValidMoves()) {
    initGrid();
    document.getElementById("no-moves").style.display = "block";
    setTimeout(() => document.getElementById("no-moves").style.display = "none", 2500);
  }
}

// ── Delay helper ─────────────────────────────────────────────────────────────
const delay = ms => new Promise(r => setTimeout(r, ms));

// ── Render ────────────────────────────────────────────────────────────────────
function renderGrid(matchedSet = new Set(), newCells = new Set()) {
  const board = document.getElementById("board");
  board.innerHTML = "";
  for(let r = 0; r < SIZE; r++) {
    for(let c = 0; c < SIZE; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const key = `${r},${c}`;
      if(matchedSet.has(key)) cell.classList.add("matched");
      if(newCells.has(key)) cell.classList.add("new-in");
      cell.textContent = EMOJIS[grid[r][c]] ?? "";
      cell.dataset.r = r; cell.dataset.c = c;
      if(selected && selected.r === r && selected.c === c) cell.classList.add("selected");
      cell.addEventListener("click", () => handleClick(r, c));
      board.appendChild(cell);
    }
  }
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById("score-val").textContent = score;
  document.getElementById("moves-val").textContent = movesLeft;
  document.getElementById("best-val").textContent = bestScore;
}

function bumpEl(id) {
  const el = document.getElementById(id);
  el.classList.remove("bump");
  void el.offsetWidth;
  el.classList.add("bump");
}

// ── Combo toast ───────────────────────────────────────────────────────────────
function showCombo(cascade) {
  if(cascade < 1) return;
  const msgs = ["Combo! 🔥","Super! 🔥🔥","Mega! 💥","Incredibile! ⚡","LEGGENDARIO! 🛵💨"];
  const toast = document.getElementById("combo-toast");
  toast.textContent = msgs[Math.min(cascade - 1, msgs.length - 1)];
  toast.classList.remove("show");
  void toast.offsetWidth;
  toast.classList.add("show");
}

// ── Match processing (recursive for cascades) ─────────────────────────────────
async function processMatches(cascade = 0) {
  const matched = findMatches();
  if(matched.size === 0) return false;

  const points = matched.size * 10 * (cascade + 1);
  score += points;
  bumpEl("score-val");
  showCombo(cascade);

  // Show matched animation
  renderGrid(matched);
  await delay(380);

  // Nullify matched
  for(const key of matched) {
    const [r, c] = key.split(",").map(Number);
    grid[r][c] = null;
  }

  // Gravity + refill, track new cells
  const prevGrid = grid.map(row => [...row]);
  applyGravity();
  const newCells = new Set();
  for(let r = 0; r < SIZE; r++)
    for(let c = 0; c < SIZE; c++)
      if(prevGrid[r][c] === null) newCells.add(`${r},${c}`);

  renderGrid(new Set(), newCells);
  await delay(280);

  await processMatches(cascade + 1);
  return true;
}

// ── Swap logic ────────────────────────────────────────────────────────────────
function isAdjacent(r1, c1, r2, c2) {
  return (Math.abs(r1-r2) + Math.abs(c1-c2)) === 1;
}

async function trySwap(r1, c1, r2, c2) {
  animating = true;
  selected = null;

  [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
  renderGrid();
  await delay(120);

  const hadMatch = await processMatches();

  if(!hadMatch) {
    // Swap back — invalid move, don't consume a move
    [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
    renderGrid();
  } else {
    movesLeft--;
    updateHUD();
    bumpEl("moves-val");
    shuffleIfNeeded();
    renderGrid();
    if(movesLeft === 0) {
      await delay(400);
      endGame();
    }
  }

  animating = false;
}

// ── Click handler ─────────────────────────────────────────────────────────────
function handleClick(r, c) {
  if(animating || movesLeft === 0) return;
  if(!selected) {
    selected = {r, c};
    renderGrid();
    return;
  }
  if(selected.r === r && selected.c === c) {
    selected = null;
    renderGrid();
    return;
  }
  if(isAdjacent(selected.r, selected.c, r, c)) {
    trySwap(selected.r, selected.c, r, c);
  } else {
    selected = {r, c};
    renderGrid();
  }
}

// ── Game over ─────────────────────────────────────────────────────────────────
function endGame() {
  let isRecord = false;
  if(score > bestScore) {
    bestScore = score;
    localStorage.setItem("vespycrash_best", bestScore);
    isRecord = true;
  }
  document.getElementById("final-score").textContent = score;
  document.getElementById("record-msg").textContent = isRecord
    ? "🏆 Nuovo record! Boia che giocatore!"
    : `Record: ${bestScore}`;
  document.getElementById("overlay").classList.add("show");
}

// ── Restart ───────────────────────────────────────────────────────────────────
function restart() {
  document.getElementById("overlay").classList.remove("show");
  score = 0;
  movesLeft = MAX_MOVES;
  selected = null;
  animating = false;
  initGrid();
  updateHUD();
  renderGrid();
}

// ── Init ──────────────────────────────────────────────────────────────────────
initGrid();
updateHUD();
renderGrid();
</script>
</body>
</html>
